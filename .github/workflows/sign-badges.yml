name: Sign lossless rank heads
on:
  workflow_dispatch:
  push:
    branches: [arena/ec44b073-fancytags-v2]
    paths: [tools/badges/sign_heads.py]
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install requests pillow
      - name: Sign and verify original face pixels
        env:
          MINESKIN_API_KEY: ${{ secrets.MINESKIN_API_KEY }}
        run: |
          set -o pipefail
          python -u tools/badges/sign_heads.py 2>&1 | tee "$RUNNER_TEMP/sign.log" || {
            detail=$(tail -3 "$RUNNER_TEMP/sign.log"); echo "::error::${detail//$'\n'/%0A}"; exit 1;
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-head-data
          path: |
            plugin/src/main/resources/head-textures.properties
            plugin/src/main/resources/rank-heads.properties
