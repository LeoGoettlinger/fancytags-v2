name: Inspect original badge artwork
on: [push]
permissions:
  contents: read
jobs:
  artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install pillow
      - run: python tools/badges/reference.py plugin/src/main/java/dev/vatten/baserad/configs/OriginalRankBadges.java
