name: Verify rank artwork
on: [push, pull_request]
permissions:
  contents: read
jobs:
  artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install pillow==12.2.0
      - name: Verify generated rank sprites against the golden OWNER geometry
        run: |
          python tools/badges/build.py
          git diff --exit-code -- plugin/src/main/resources/rank-sprites.properties
          python - <<'PY'
          import io, subprocess, zipfile
          from PIL import Image, ImageChops
          path = 'artwork/FancyTags-Ranks.zip'
          with zipfile.ZipFile(path) as actual, zipfile.ZipFile(io.BytesIO(subprocess.check_output(['git','show','HEAD:'+path]))) as expected:
              assert actual.namelist() == expected.namelist()
              for name in actual.namelist():
                  a, b = actual.read(name), expected.read(name)
                  if name.endswith('.png'):
                      assert not ImageChops.difference(Image.open(io.BytesIO(a)), Image.open(io.BytesIO(b))).getbbox(), name
                  else:
                      assert a == b, name
          PY
