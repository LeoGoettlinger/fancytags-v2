name: Build FancyTags for Paper
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  textures:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Restore previously verified faces
        if: ${{ hashFiles('plugin/src/main/resources/rank-heads.properties') == '' }}
        uses: actions/cache/restore@v4
        with:
          path: plugin/src/main/resources/head-textures.properties
          key: signed-ranks-${{ hashFiles('artwork/FancyTags-Ranks.zip') }}-${{ github.run_id }}
          restore-keys: signed-ranks-${{ hashFiles('artwork/FancyTags-Ranks.zip') }}-
      - name: Sign missing heads once on the publishing branch
        if: ${{ hashFiles('plugin/src/main/resources/rank-heads.properties') == '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/arena/ec44b073-fancytags-v2' }}
        id: sign
        env:
          MINESKIN_API_KEY: ${{ secrets.MINESKIN_API_KEY }}
        run: |
          python -m pip install requests pillow
          python -u tools/badges/sign_heads.py 2>&1 | tee "$RUNNER_TEMP/sign.log" || {
            detail=$(tail -3 "$RUNNER_TEMP/sign.log"); echo "::error::${detail//$'\n'/%0A}"; exit 1;
          }
        shell: bash
      - name: Save verified progress even if MineSkin is unavailable
        if: ${{ always() && steps.sign.outcome != 'skipped' && hashFiles('plugin/src/main/resources/head-textures.properties') != '' }}
        uses: actions/cache/save@v4
        with:
          path: plugin/src/main/resources/head-textures.properties
          key: signed-ranks-${{ hashFiles('artwork/FancyTags-Ranks.zip') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - run: test -s plugin/src/main/resources/rank-heads.properties && test -s plugin/src/main/resources/head-textures.properties
      - uses: actions/upload-artifact@v4
        with:
          name: verified-head-data
          path: |
            plugin/src/main/resources/head-textures.properties
            plugin/src/main/resources/rank-heads.properties
  compile:
    needs: textures
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper: ['26.2', '26.3']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: verified-head-data
          path: plugin/src/main/resources/
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build shaded plugin
        run: |
          ./gradlew :plugin:test :paper:shadowJar -PpaperApiVersion=${{ matrix.paper }} --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            details=$(tail -80 "$RUNNER_TEMP/build.log"); details=${details//%/%25}; echo "::error::${details//$'\n'/%0A}"
            exit 1
          }
        shell: bash
      - name: Verify packaged config and descriptor
        run: |
          unzip -p paper/build/libs/FancyTags-*.jar display-switch.yml | grep -Fx 'tags:'
          unzip -p paper/build/libs/FancyTags-*.jar paper-plugin.yml > "$RUNNER_TEMP/descriptor"
          grep -Fx "api-version: '26.2'" "$RUNNER_TEMP/descriptor"
          grep -Fx 'authors: [SampleCraft]' "$RUNNER_TEMP/descriptor"
          unzip -p paper/build/libs/FancyTags-*.jar head-textures.properties > "$RUNNER_TEMP/heads"
          cmp "$RUNNER_TEMP/heads" plugin/src/main/resources/head-textures.properties
          unzip -p paper/build/libs/FancyTags-*.jar rank-heads.properties > "$RUNNER_TEMP/ranks"
          cmp "$RUNNER_TEMP/ranks" plugin/src/main/resources/rank-heads.properties
          test "$(grep -c '=' "$RUNNER_TEMP/heads")" -eq 122
          test "$(grep -c '=' "$RUNNER_TEMP/ranks")" -eq 23
          unzip -p paper/build/libs/FancyTags-*.jar rank-sprites.properties > "$RUNNER_TEMP/widths"
          test "$(grep -c '=' "$RUNNER_TEMP/widths")" -eq 23
          # Every rank needs the same number of heads as its strip has tiles.
          diff <(grep -v '^#' "$RUNNER_TEMP/widths" | cut -d= -f1 | sort) <(grep -v '^#' "$RUNNER_TEMP/ranks" | cut -d= -f1 | sort)
          while IFS='=' read -r rank width; do
            test "$(tr ',' '\n' < <(grep "^$rank=" "$RUNNER_TEMP/ranks" | cut -d= -f2-) | grep -c .)" -eq "$width"
          done < <(grep -v '^#' "$RUNNER_TEMP/widths")
      - name: Stage this Paper version
        uses: actions/upload-artifact@v4
        with:
          name: verified-paper-${{ matrix.paper }}
          path: paper/build/libs/FancyTags-*.jar
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: verified-paper-*
          path: "${{ runner.temp }}/jars"
      - name: Publish only when both Paper versions verified
        run: |
          # Fails the publish step instead of handing out a jar from a half-finished matrix.
          test -n "$(find "${{ runner.temp }}/jars/verified-paper-26.2" -name 'FancyTags-*.jar')"
          test -n "$(find "${{ runner.temp }}/jars/verified-paper-26.3" -name 'FancyTags-*.jar')"
          mkdir -p "${{ runner.temp }}/release"
          cp "${{ runner.temp }}"/jars/verified-paper-26.2/FancyTags-*.jar "${{ runner.temp }}/release/"
      - name: Record the exact jar identity
        run: |
          for jar in "${{ runner.temp }}"/release/FancyTags-*.jar; do
            size=$(stat -c%s "$jar")
            echo "::notice title=JAR SHA256::$(sha256sum "$jar" | cut -d' ' -f1) ($size bytes, $(basename "$jar"))"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: FancyTags-Paper-26.2-26.3
          path: "${{ runner.temp }}/release/FancyTags-*.jar"
          if-no-files-found: error
  smoke:
    needs: compile
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        paper: ['26.2', '26.3']
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-paper-26.2
          path: jars
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Boot a real Paper ${{ matrix.paper }} server with the built jar
        run: |
          set -euo pipefail
          mkdir -p server/plugins && cd server
          echo 'eula=true' > eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-players=1\nspawn-protection=0\nview-distance=2\n' > server.properties
          # Paper moved to the fill API; try it first and fall back to the legacy one.
          url=$(python3 - <<'PY'
          import json, urllib.request
          def get(u):
              with urllib.request.urlopen(u, timeout=60) as r: return json.load(r)
          def latest(payload):
              builds = payload['builds'] if isinstance(payload, dict) and 'builds' in payload else payload
              return builds[0] if isinstance(builds, list) and builds else builds
          try:
              b = latest(get('https://fill.papermc.io/v3/projects/paper/versions/${{ matrix.paper }}/builds'))
              downloads = b['downloads']
              for key in ('server:default', 'application', 'server'):
                  if isinstance(downloads, dict) and key in downloads:
                      entry = downloads[key]
                      print(entry['url'] if isinstance(entry, dict) else entry)
                      raise SystemExit(0)
              print(downloads['url'])
          except SystemExit:
              raise
          except Exception:
              v = get('https://api.papermc.io/v2/projects/paper/versions/${{ matrix.paper }}')
              b = v['builds'][-1]
              print(f"https://api.papermc.io/v2/projects/paper/versions/${{ matrix.paper }}/builds/{b}/downloads/paper-${{ matrix.paper }}-{b}.jar")
          PY
          )
          curl -fsSL -o paper.jar "$url"
          cp ../jars/FancyTags-*.jar plugins/
          timeout 420 java -Xmx1G -jar paper.jar --nogui > out.log 2>&1 || true
          grep -iE 'Enabling FancyTags|Done \(' out.log | head -5
          echo '--- plugin file seen by the server:'
          ls -l plugins/
          if ! grep -q 'Done (' out.log; then echo '::error::Paper ${{ matrix.paper }} never finished starting'; tail -40 out.log; exit 1; fi
          if ! grep -qi 'Enabling FancyTags' out.log; then echo '::error::FancyTags did not enable'; tail -40 out.log; exit 1; fi
          if grep -qiE 'Could not load plugin|Error occurred while enabling FancyTags|Failed to load' out.log; then
            echo '::error::Paper reported a plugin error'; grep -iA6 -E 'Could not load plugin|Error occurred while enabling|Failed to load' out.log | head -40; exit 1
          fi
          echo "::notice title=Paper ${{ matrix.paper }} smoke test::$(grep -i 'Enabling FancyTags' out.log | head -1) — no resource pack, no MineSkin key"
  preserve-verified-heads:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/ec44b073-fancytags-v2'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: verified-head-data
          path: plugin/src/main/resources/
      - name: Keep subsequent builds offline
        run: |
          git add plugin/src/main/resources/{rank-heads,head-textures}.properties
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Bundle pixel-verified Mojang head profiles for offline builds'
            git push origin HEAD:refs/heads/arena/ec44b073-fancytags-v2
          fi
