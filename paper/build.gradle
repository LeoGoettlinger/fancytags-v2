plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.0.2"
}

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

// The release jar targets the oldest supported API; CI also checks the newer API.
def apiVersion = providers.gradleProperty("paperApiVersion").getOrElse("26.2")

dependencies {
    compileOnly("io.papermc.paper:paper-api:${apiVersion}.build.+")
    implementation("org.bstats:bstats-bukkit:3.0.2")
    implementation(project(":common"))
    implementation(project(":plugin"))
}

shadowJar {
    relocate("org.bstats", "dev.vatten.library.bstats")
}

def serverVersion = providers.gradleProperty("paperVersion").getOrElse("26.2")

tasks.runServer {
    minecraftVersion(serverVersion)
    runDirectory(file("run/${serverVersion}"))
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
